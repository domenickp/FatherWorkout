<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Father Workout</title>
<style>
  :root {
    --bg: #f3f5f4;
    --card: #ffffff;
    --card-alt: #f8faf9;
    --text: #1d2523;
    --muted: #5f6d69;
    --border: #d9e0dd;
    --accent: #1f6f5c;
    --accent-text: #ffffff;
    --accent-soft: #dcefe9;
    --ok: #2e7d4f;
    --warn-bg: #fff4d6;
    --warn-text: #6b4e00;
    --danger: #b3382c;
    --shadow: 0 1px 2px rgba(0, 0, 0, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121716;
      --card: #1c2321;
      --card-alt: #172020;
      --text: #e6eeeb;
      --muted: #9aaba6;
      --border: #2e3a37;
      --accent: #4cc2a1;
      --accent-text: #08201a;
      --accent-soft: #1d3a33;
      --ok: #5fd08a;
      --warn-bg: #3a3014;
      --warn-text: #f2d98a;
      --danger: #ff8a7d;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow-x: hidden;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  #app { max-width: 640px; margin: 0 auto; padding: 0 12px 110px; }

  /* top bar */
  .topbar { display: flex; align-items: center; gap: 8px; padding: 12px 0 8px; }
  .topbar h1 { font-size: 1.15rem; margin: 0; flex: 1; min-width: 0; }
  .tabs { display: flex; gap: 6px; }
  .tab {
    min-height: 44px; padding: 0 14px; border-radius: 22px;
    border: 1px solid var(--border); background: var(--card); color: var(--muted);
  }
  .tab[aria-current="page"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }

  /* day picker */
  .days { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 4px 0 14px; }
  .day {
    min-height: 52px; padding: 6px 10px; text-align: left; border-radius: 12px;
    border: 1px solid var(--border); background: var(--card); box-shadow: var(--shadow);
    display: flex; flex-direction: column; justify-content: center; min-width: 0;
  }
  .day b { font-size: .95rem; }
  .day span { font-size: .8rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .day[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); outline: 2px solid var(--accent); outline-offset: -2px; }

  /* cards */
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  .card.warm { background: var(--card-alt); }
  .ex-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; }
  .ex-head h3 { margin: 0; font-size: 1.05rem; overflow-wrap: anywhere; }
  .tag {
    font-size: .72rem; text-transform: uppercase; letter-spacing: .04em;
    padding: 2px 8px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-text);
  }
  .target { margin: 2px 0 0; font-weight: 600; color: var(--accent); }
  .note { margin: 4px 0 0; font-size: .88rem; color: var(--muted); }
  .last { margin: 6px 0 8px; font-size: .9rem; color: var(--muted); overflow-wrap: anywhere; }
  .last b { color: var(--text); font-weight: 600; }

  /* set rows */
  .set { border-top: 1px solid var(--border); padding: 8px 0; }
  .set-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .set-btns { display: flex; align-items: center; gap: 8px; }
  .remove-btn {
    min-height: 44px; min-width: 44px; padding: 0; border-radius: 22px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-size: 1.3rem; line-height: 1; cursor: pointer;
  }
  .set-n { font-weight: 600; font-size: .9rem; color: var(--muted); }
  .done-btn {
    min-height: 44px; min-width: 96px; padding: 0 14px; border-radius: 22px;
    border: 2px solid var(--border); background: transparent; color: var(--muted); font-weight: 600;
  }
  .done-btn[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
  .set.is-done .stepper { opacity: .75; }
  .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .fields.one { grid-template-columns: minmax(0, 1fr); }
  .field { min-width: 0; }
  .field label { display: block; font-size: .75rem; color: var(--muted); margin: 0 0 2px 2px; }
  .stepper { display: flex; align-items: stretch; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--card); }
  .stepper button {
    flex: 0 0 44px; min-height: 48px; border: 0; background: var(--card-alt);
    font-size: 1.4rem; line-height: 1; color: var(--accent);
  }
  .stepper input {
    flex: 1 1 0; min-width: 0; width: 100%; border: 0; text-align: center; background: transparent;
    font-size: 1.2rem; font-weight: 600; padding: 0 2px; min-height: 48px; -moz-appearance: textfield;
  }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .stepper input::placeholder { color: var(--muted); font-weight: 400; }
  .stepper input:focus { outline: 2px solid var(--accent); outline-offset: -2px; }

  .card-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .link-btn {
    min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px dashed var(--border);
    background: transparent; color: var(--accent); font-weight: 600;
  }
  textarea.notes {
    display: block; width: 100%; min-height: 64px; margin-top: 6px; padding: 10px;
    border: 1px solid var(--border); border-radius: 12px; background: var(--card); resize: vertical;
  }
  textarea.notes:focus { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* finish bar */
  .finish-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 70%, transparent);
  }
  .finish-bar > div { max-width: 640px; margin: 0 auto; }
  .primary {
    width: 100%; min-height: 54px; border: 0; border-radius: 14px; font-weight: 700; font-size: 1.05rem;
    background: var(--accent); color: var(--accent-text);
  }
  .primary:disabled { opacity: .6; }
  .secondary {
    min-height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card); font-weight: 600;
  }

  /* rest timer */
  .rest {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    padding: 8px 12px calc(8px); display: none;
  }
  .rest.on { display: block; }
  .rest-inner {
    max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 6px 6px 6px 14px; border-radius: 16px; background: var(--accent); color: var(--accent-text);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
  }
  .rest-inner.over { background: var(--ok); color: #fff; }
  .rest-label { flex: 1; min-width: 0; font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rest-time { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rest button {
    min-height: 44px; min-width: 44px; padding: 0 10px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, .5);
    background: rgba(255, 255, 255, .15); color: inherit; font-weight: 600;
  }

  /* history */
  .hist {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; min-height: 64px;
    padding: 10px 12px; margin-bottom: 8px; border-radius: 14px; border: 1px solid var(--border);
    background: var(--card); box-shadow: var(--shadow);
  }
  .hist-main { flex: 1; min-width: 0; }
  .hist-main b { display: block; }
  .hist-main span { color: var(--muted); font-size: .88rem; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-sets { text-align: right; font-size: .85rem; color: var(--muted); white-space: nowrap; }
  .hist-sets b { display: block; font-size: 1.2rem; color: var(--text); }
  .banner-ok { padding: 12px; border-radius: 12px; margin-bottom: 12px; background: var(--accent-soft); border: 1px solid var(--accent); }
  .banner-ok b { display: block; }
  .detail-set { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid var(--border); font-size: .95rem; }
  .detail-set.skipped { color: var(--muted); }
  .back { margin-bottom: 10px; }
  h2.sec { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 16px 2px 8px; }

  /* states */
  .center { text-align: center; padding: 48px 12px; color: var(--muted); }
  .spinner {
    width: 36px; height: 36px; margin: 0 auto 12px; border-radius: 50%;
    border: 4px solid var(--border); border-top-color: var(--accent); animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err { color: var(--danger); margin-bottom: 12px; overflow-wrap: anywhere; }
  .muted { color: var(--muted); }

  /* modal + toast */
  .scrim {
    position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .5);
    display: flex; align-items: flex-end; justify-content: center; padding: 12px;
  }
  .sheet { width: 100%; max-width: 480px; background: var(--card); border-radius: 18px; padding: 18px; }
  .sheet p { margin: 0 0 14px; }
  .sheet .btns { display: flex; flex-direction: column; gap: 8px; }
  .toast {
    position: fixed; left: 12px; right: 12px; bottom: 84px; z-index: 40; max-width: 616px; margin: 0 auto;
    padding: 12px 14px; border-radius: 12px; background: var(--text); color: var(--bg); text-align: center;
  }
  .toast.bad { background: var(--danger); color: #fff; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="rest" class="rest" role="timer" aria-live="off"></div>
<div id="app"><div class="center"><div class="spinner"></div>Loading…</div></div>

<script id="fw-logic">
/* Pure logic: no DOM access. Loaded in Node (vm) by test/ui.test.js. */
var FW = (function () {
  'use strict';

  function toNum(v) {
    if (v === null || v === undefined) return null;
    if (typeof v === 'string') {
      v = v.trim();
      if (v === '') return null;
    }
    var n = Number(v);
    if (!isFinite(n) || n < 0) return null;
    return n;
  }

  function formatNum(n) {
    if (n === null || n === undefined || n === '') return '';
    return String(Number(Number(n).toFixed(2)));
  }

  // Upper bound of a rest string, in seconds. "2 min" -> 120, "60–90 sec" -> 90.
  function parseRestSeconds(rest) {
    if (rest === null || rest === undefined) return null;
    var s = String(rest).toLowerCase();
    var nums = s.match(/\d+(?:\.\d+)?/g);
    if (!nums) return null;
    var max = 0;
    for (var i = 0; i < nums.length; i++) max = Math.max(max, parseFloat(nums[i]));
    var unit = /min/.test(s) ? 60 : 1;
    return Math.round(max * unit);
  }

  // "3 × 12 @ 45 lb · rest 2 min", "10 min", "3 × 20"
  function formatTarget(ex) {
    var main = '';
    if (ex.reps !== null && ex.reps !== undefined) {
      main = (ex.sets || 1) + ' × ' + formatNum(ex.reps);
      if (ex.weightLb !== null && ex.weightLb !== undefined) main += ' @ ' + formatNum(ex.weightLb) + ' lb';
    } else if (ex.timeMin !== null && ex.timeMin !== undefined) {
      main = (ex.sets > 1 ? ex.sets + ' × ' : '') + formatNum(ex.timeMin) + ' min';
    } else if (ex.sets) {
      main = ex.sets + (ex.sets === 1 ? ' set' : ' sets');
    }
    if (ex.rest) main += (main ? ' · ' : '') + 'rest ' + ex.rest;
    return main;
  }

  // Default day = the day after the newest completed session (wrapping), else the first day.
  function defaultDay(routine, recent) {
    var days = routine.days.map(function (d) { return d.day; }).sort(function (a, b) { return a - b; });
    if (!days.length) return null;
    var newest = null;
    var list = recent || [];
    for (var i = 0; i < list.length; i++) {
      var s = list[i];
      if (s && s.completedAt && (!newest || s.startedAt > newest.startedAt)) newest = s;
    }
    if (!newest) return days[0];
    for (var j = 0; j < days.length; j++) if (days[j] > newest.day) return days[j];
    return days[0];
  }

  function doneSets(entry) {
    if (!entry || !entry.sets) return [];
    return entry.sets.filter(function (s) { return s && s.done; });
  }

  // "12×40, 12×40, 10×40" | "20, 18" | "1 min" | "—"
  function formatLastTime(entry) {
    var sets = doneSets(entry);
    if (!sets.length) return '—';
    return sets.map(function (s) {
      var hasReps = s.reps !== null && s.reps !== undefined;
      var hasW = s.weightLb !== null && s.weightLb !== undefined;
      var hasT = s.timeMin !== null && s.timeMin !== undefined;
      if (hasReps && hasW) return formatNum(s.reps) + '×' + formatNum(s.weightLb);
      if (hasReps) return formatNum(s.reps);
      if (hasW) return formatNum(s.weightLb) + ' lb';
      if (hasT) return formatNum(s.timeMin) + ' min';
      return '✓';
    }).join(', ');
  }

  // True when this exercise is logged as minutes rather than reps/weight.
  function isTimed(ex) {
    return (ex.reps === null || ex.reps === undefined) && ex.timeMin !== null && ex.timeMin !== undefined;
  }

  // Starting set rows for an exercise: last time's matching done set, else the target.
  function initialSets(ex, lastEntry) {
    var count = Math.max(1, ex.sets || 1);
    var prev = doneSets(lastEntry);
    var out = [];
    for (var i = 0; i < count; i++) {
      var p = prev[i];
      if (p) {
        out.push({ reps: toNum(p.reps), weightLb: toNum(p.weightLb), timeMin: toNum(p.timeMin), done: false });
      } else if (isTimed(ex)) {
        out.push({ reps: null, weightLb: null, timeMin: toNum(ex.timeMin), done: false });
      } else {
        out.push({ reps: toNum(ex.reps), weightLb: toNum(ex.weightLb), timeMin: null, done: false });
      }
    }
    return out;
  }

  // Sets without the one at idx. Never removes the last remaining set.
  function removeSetAt(sets, idx) {
    if (!Array.isArray(sets) || sets.length <= 1 || idx < 0 || idx >= sets.length) return sets.slice();
    return sets.slice(0, idx).concat(sets.slice(idx + 1));
  }

  function cleanNote(s) {
    if (s === null || s === undefined) return null;
    s = String(s).trim();
    return s === '' ? null : s;
  }

  // state: { id, day, startedAt, completedAt, notes, exercises: [{id,name}], log: { [exerciseId]: { sets, notes } } }
  function buildSession(state) {
    var entries = [];
    (state.exercises || []).forEach(function (ex) {
      var l = state.log && state.log[ex.id];
      if (!l) return;
      var note = cleanNote(l.notes);
      var sets = (l.sets || []).map(function (s) {
        return {
          reps: toNum(s.reps),
          weightLb: toNum(s.weightLb),
          timeMin: toNum(s.timeMin),
          done: !!s.done
        };
      });
      var anyDone = sets.some(function (s) { return s.done; });
      if (!anyDone && note === null) return;
      if (!sets.length) sets.push({ reps: null, weightLb: null, timeMin: null, done: false });
      entries.push({ exerciseId: ex.id, name: ex.name, sets: sets, notes: note });
    });
    return {
      schemaVersion: 1,
      id: state.id,
      day: state.day,
      startedAt: state.startedAt,
      completedAt: state.completedAt === undefined ? null : state.completedAt,
      entries: entries,
      notes: cleanNote(state.notes)
    };
  }

  function summarize(session) {
    var done = 0;
    session.entries.forEach(function (e) {
      e.sets.forEach(function (s) { if (s.done) done++; });
    });
    return {
      id: session.id, day: session.day, startedAt: session.startedAt, completedAt: session.completedAt,
      exerciseCount: session.entries.length, setsDone: done
    };
  }

  function countDone(log) {
    var n = 0;
    Object.keys(log || {}).forEach(function (k) {
      (log[k].sets || []).forEach(function (s) { if (s.done) n++; });
    });
    return n;
  }

  function formatClock(totalSec) {
    totalSec = Math.max(0, Math.ceil(totalSec));
    var m = Math.floor(totalSec / 60);
    var s = totalSec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function formatSessionDate(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }) + ' · ' +
      d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }

  return {
    toNum: toNum, formatNum: formatNum, parseRestSeconds: parseRestSeconds, formatTarget: formatTarget,
    defaultDay: defaultDay, formatLastTime: formatLastTime, isTimed: isTimed, initialSets: initialSets, removeSetAt: removeSetAt,
    buildSession: buildSession, summarize: summarize, countDone: countDone, formatClock: formatClock,
    formatSessionDate: formatSessionDate
  };
})();
</script>

<script id="fw-ui">
(function () {
  'use strict';

  var DRAFT_KEY = 'fw-draft';
  var root = document.getElementById('app');
  var restEl = document.getElementById('rest');

  var app = {
    data: null,        // getAppData() result
    tab: 'workout',    // 'workout' | 'history'
    day: null,
    meta: null,        // { id, startedAt }
    log: {},           // exerciseId -> { sets, notes }
    sessionNotes: '',
    dirty: false,
    saving: false,
    detail: null,      // { loading, error, session }
    justSaved: null,
    rest: null,
    restTick: null
  };

  /* ---------- helpers ---------- */

  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
        else if (k === 'value') el.value = v;
        else el.setAttribute(k, v === true ? '' : v);
      });
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c === null || c === undefined || c === false) continue;
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return el;
  }

  function run() { return window.google.script.run; }

  function uuid() {
    try { return crypto.randomUUID(); } catch (e) {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
        var r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 3 | 8)).toString(16);
      });
    }
  }

  function errMsg(e) {
    return (e && e.message) ? e.message : String(e || 'Unknown error');
  }

  function dayObj(n) {
    var days = app.data.routine.days;
    for (var i = 0; i < days.length; i++) if (days[i].day === n) return days[i];
    return null;
  }

  var toastTimer = null;
  function toast(msg, bad) {
    var old = document.getElementById('toast');
    if (old) old.remove();
    var t = h('div', { id: 'toast', class: 'toast' + (bad ? ' bad' : ''), role: 'status', text: msg });
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.remove(); }, bad ? 6000 : 2500);
  }

  // Simple in-page dialog (window.confirm is unreliable inside the Apps Script sandbox).
  function ask(message, buttons) {
    var scrim = h('div', { class: 'scrim', role: 'dialog', 'aria-modal': 'true' });
    var btns = h('div', { class: 'btns' });
    buttons.forEach(function (b) {
      btns.appendChild(h('button', {
        class: b.primary ? 'primary' : 'secondary', text: b.label,
        onclick: function () { scrim.remove(); b.action(); }
      }));
    });
    scrim.appendChild(h('div', { class: 'sheet' }, h('p', { text: message }), btns));
    document.body.appendChild(scrim);
  }

  /* ---------- draft (localStorage) ---------- */

  function saveDraft() {
    try {
      if (!app.dirty) return;
      localStorage.setItem(DRAFT_KEY, JSON.stringify({
        v: 1, id: app.meta.id, day: app.day, startedAt: app.meta.startedAt,
        notes: app.sessionNotes, log: app.log
      }));
    } catch (e) { /* storage unavailable: carry on without a draft */ }
  }
  function loadDraft() {
    try {
      var raw = localStorage.getItem(DRAFT_KEY);
      if (!raw) return null;
      var d = JSON.parse(raw);
      if (!d || d.v !== 1 || !d.log || !d.id || !d.startedAt) return null;
      return d;
    } catch (e) { return null; }
  }
  function clearDraft() {
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* ignore */ }
  }
  function markDirty() {
    app.dirty = true;
    saveDraft();
    updateFinishBar();
  }

  /* ---------- workout state ---------- */

  function startDay(n, draft) {
    app.day = n;
    app.dirty = false;
    app.sessionNotes = '';
    app.meta = { id: uuid(), startedAt: new Date().toISOString() };
    var last = (app.data.lastByDay || {})[String(n)] || null;
    var lastEntries = {};
    if (last) last.entries.forEach(function (e) { lastEntries[e.exerciseId] = e; });
    app.log = {};
    dayObj(n).exercises.forEach(function (ex) {
      app.log[ex.id] = { sets: FW.initialSets(ex, lastEntries[ex.id] || null), notes: '' };
    });
    if (draft) {
      app.meta = { id: draft.id, startedAt: draft.startedAt };
      app.sessionNotes = draft.notes || '';
      Object.keys(app.log).forEach(function (id) {
        var d = draft.log[id];
        if (d && Array.isArray(d.sets) && d.sets.length) {
          app.log[id] = {
            sets: d.sets.map(function (s) {
              return { reps: FW.toNum(s.reps), weightLb: FW.toNum(s.weightLb), timeMin: FW.toNum(s.timeMin), done: !!s.done };
            }),
            notes: d.notes || ''
          };
        }
      });
      app.dirty = true;
    }
  }

  function newSetFor(ex, sets, last) {
    var prevRow = sets[sets.length - 1];
    var lastSet = last && last.sets.filter(function (s) { return s.done; })[sets.length];
    var src = lastSet || prevRow || {};
    return { reps: FW.toNum(src.reps), weightLb: FW.toNum(src.weightLb), timeMin: FW.toNum(src.timeMin), done: false };
  }

  /* ---------- rest timer ---------- */

  function startRest(seconds, label) {
    stopRest();
    app.rest = { end: Date.now() + seconds * 1000, label: label, over: false };
    restEl.classList.add('on');
    tickRest();
    app.restTick = setInterval(tickRest, 250);
  }
  function stopRest() {
    clearInterval(app.restTick);
    app.restTick = null;
    app.rest = null;
    restEl.classList.remove('on');
    restEl.textContent = '';
  }
  function extendRest(sec) {
    if (!app.rest) return;
    app.rest.end = Math.max(Date.now(), app.rest.end) + sec * 1000;
    app.rest.over = false;
    if (!app.restTick) app.restTick = setInterval(tickRest, 250);
    tickRest();
  }
  function tickRest() {
    var r = app.rest;
    if (!r) return;
    var left = (r.end - Date.now()) / 1000;
    var over = left <= 0;
    if (over && !r.over) {
      r.over = true;
      clearInterval(app.restTick);
      app.restTick = null;
      try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) { /* ignore */ }
    }
    restEl.textContent = '';
    restEl.appendChild(h('div', { class: 'rest-inner' + (over ? ' over' : '') },
      h('div', { class: 'rest-label', text: over ? 'Rest over. Next set!' : 'Rest · ' + r.label }),
      h('div', { class: 'rest-time', text: over ? '0:00' : FW.formatClock(left) }),
      h('button', { type: 'button', 'aria-label': 'Add 30 seconds', text: '+30s', onclick: function () { extendRest(30); } }),
      h('button', { type: 'button', 'aria-label': 'Dismiss rest timer', text: '✕', onclick: stopRest })
    ));
  }

  /* ---------- load ---------- */

  function boot() {
    root.textContent = '';
    root.appendChild(h('div', { class: 'center' }, h('div', { class: 'spinner' }), 'Loading…'));
    run().withSuccessHandler(onData).withFailureHandler(function (e) {
      root.textContent = '';
      root.appendChild(h('div', { class: 'center' },
        h('div', { class: 'err', text: 'Could not load: ' + errMsg(e) }),
        h('button', { class: 'secondary', text: 'Retry', onclick: boot })));
    }).getAppData();
  }

  function onData(data) {
    app.data = data;
    var draft = loadDraft();
    var dd = draft && dayObj(draft.day);
    if (dd) {
      startDay(FW.defaultDay(data.routine, data.recent));
      render();
      ask('You have an unfinished Day ' + draft.day + ' workout from ' + FW.formatSessionDate(draft.startedAt) + '. Resume it?', [
        { label: 'Resume workout', primary: true, action: function () { startDay(draft.day, draft); render(); } },
        { label: 'Discard it', action: function () { clearDraft(); } }
      ]);
    } else {
      if (draft) clearDraft();
      startDay(FW.defaultDay(data.routine, data.recent));
      render();
    }
  }

  /* ---------- rendering ---------- */

  function render() {
    root.textContent = '';
    root.appendChild(h('div', { class: 'topbar' },
      h('h1', { text: 'Father Workout' }),
      h('div', { class: 'tabs' },
        h('button', { class: 'tab', type: 'button', text: 'Workout', 'aria-current': app.tab === 'workout' ? 'page' : null,
          onclick: function () { app.tab = 'workout'; render(); } }),
        h('button', { class: 'tab', type: 'button', text: 'History', 'aria-current': app.tab === 'history' ? 'page' : null,
          onclick: function () { app.tab = 'history'; app.detail = null; render(); } })
      )));
    var old = document.getElementById('finish');
    if (old) old.remove();
    if (app.tab === 'workout') renderWorkout();
    else if (app.detail) renderDetail();
    else renderHistory();
    window.scrollTo(0, 0);
  }

  function renderWorkout() {
    var picker = h('div', { class: 'days', role: 'group', 'aria-label': 'Choose day' });
    app.data.routine.days.forEach(function (d) {
      picker.appendChild(h('button', {
        class: 'day', type: 'button', 'aria-pressed': d.day === app.day ? 'true' : 'false',
        onclick: function () { chooseDay(d.day); }
      }, h('b', { text: 'Day ' + d.day }), h('span', { text: d.areas })));
    });
    root.appendChild(picker);

    var day = dayObj(app.day);
    var last = (app.data.lastByDay || {})[String(app.day)] || null;
    var lastEntries = {};
    if (last) last.entries.forEach(function (e) { lastEntries[e.exerciseId] = e; });
    day.exercises.forEach(function (ex) { root.appendChild(exerciseCard(ex, lastEntries[ex.id] || null)); });

    var notes = h('textarea', { class: 'notes', rows: '2', placeholder: 'Notes about this workout (optional)', 'aria-label': 'Workout notes',
      oninput: function (e) { app.sessionNotes = e.target.value; markDirty(); } });
    notes.value = app.sessionNotes;
    root.appendChild(h('h2', { class: 'sec', text: 'Workout notes' }));
    root.appendChild(notes);

    var btn = h('button', { id: 'finish-btn', class: 'primary', type: 'button', onclick: finish });
    document.body.appendChild(h('div', { id: 'finish', class: 'finish-bar' }, h('div', null, btn)));
    updateFinishBar();
  }

  function updateFinishBar() {
    var btn = document.getElementById('finish-btn');
    if (!btn) return;
    var n = FW.countDone(app.log);
    btn.disabled = app.saving;
    btn.textContent = app.saving ? 'Saving…' : 'Finish workout' + (n ? ' · ' + n + (n === 1 ? ' set' : ' sets') : '');
  }

  function chooseDay(n) {
    if (n === app.day) return;
    var go = function () { clearDraft(); stopRest(); startDay(n); render(); };
    if (app.dirty) {
      ask('Switch to Day ' + n + '? The sets you have logged for Day ' + app.day + ' will be discarded.', [
        { label: 'Discard and switch', primary: true, action: go },
        { label: 'Keep logging Day ' + app.day, action: function () {} }
      ]);
    } else go();
  }

  function exerciseCard(ex, lastEntry) {
    var rec = app.log[ex.id];
    var timed = FW.isTimed(ex);
    var restSec = FW.parseRestSeconds(ex.rest);

    var card = h('section', { class: 'card' + (ex.warmup ? ' warm' : '') });
    card.appendChild(h('div', { class: 'ex-head' },
      h('h3', { text: ex.name }),
      ex.warmup ? h('span', { class: 'tag', text: 'warm-up' }) : null));
    card.appendChild(h('p', { class: 'target', text: FW.formatTarget(ex) }));
    if (ex.notes) card.appendChild(h('p', { class: 'note', text: ex.notes }));
    card.appendChild(h('p', { class: 'last' }, 'Last time: ', h('b', { text: FW.formatLastTime(lastEntry) })));

    var setsBox = h('div');
    card.appendChild(setsBox);

    // Rows are rebuilt whenever the set list changes, so "Set N" numbering and the
    // remove buttons always match rec.sets.
    function renderRows() {
      setsBox.textContent = '';
      rec.sets.forEach(function (s, i) {
        setsBox.appendChild(setRow(ex, rec, i, timed, restSec, removeRow));
      });
    }
    function removeRow(idx) {
      rec.sets = FW.removeSetAt(rec.sets, idx);
      renderRows();
      markDirty();
    }
    renderRows();

    var actions = h('div', { class: 'card-actions' });
    actions.appendChild(h('button', { class: 'link-btn', type: 'button', text: '+ Add set', onclick: function () {
      rec.sets.push(newSetFor(ex, rec.sets, lastEntry));
      renderRows();
      markDirty();
    } }));
    var noteWrap = h('div');
    var noteBox = null;
    function showNote() {
      if (noteBox) return;
      noteBox = h('textarea', { class: 'notes', rows: '2', placeholder: 'Notes for ' + ex.name, 'aria-label': 'Notes for ' + ex.name,
        oninput: function (e) { rec.notes = e.target.value; markDirty(); } });
      noteBox.value = rec.notes || '';
      noteWrap.appendChild(noteBox);
      noteBtn.hidden = true;
    }
    var noteBtn = h('button', { class: 'link-btn', type: 'button', text: '+ Note', onclick: function () { showNote(); noteBox.focus(); } });
    actions.appendChild(noteBtn);
    card.appendChild(actions);
    card.appendChild(noteWrap);
    if (rec.notes) showNote();
    return card;
  }

  function stepper(label, unit, value, step, onChange) {
    var input = h('input', {
      type: 'number', inputmode: 'decimal', min: '0', step: 'any', placeholder: unit === 'lb' ? '–' : '–',
      'aria-label': label, value: FW.formatNum(value)
    });
    function commit() { onChange(FW.toNum(input.value)); }
    function bump(d) {
      var v = FW.toNum(input.value);
      v = Math.max(0, Math.round(((v === null ? 0 : v) + d) * 100) / 100);
      input.value = FW.formatNum(v);
      commit();
    }
    input.addEventListener('input', commit);
    input.addEventListener('focus', function () { try { input.select(); } catch (e) { /* ignore */ } });
    return h('div', { class: 'field' },
      h('label', { text: label }),
      h('div', { class: 'stepper' },
        h('button', { type: 'button', 'aria-label': 'Decrease ' + label, text: '−', onclick: function () { bump(-step); } }),
        input,
        h('button', { type: 'button', 'aria-label': 'Increase ' + label, text: '+', onclick: function () { bump(step); } })));
  }

  function setRow(ex, rec, idx, timed, restSec, onRemove) {
    var s = rec.sets[idx];
    var row = h('div', { class: 'set' + (s.done ? ' is-done' : '') });
    var doneBtn = h('button', {
      class: 'done-btn', type: 'button', 'aria-pressed': s.done ? 'true' : 'false', text: s.done ? '✓ Done' : 'Done',
      onclick: function () {
        s.done = !s.done;
        doneBtn.setAttribute('aria-pressed', s.done ? 'true' : 'false');
        doneBtn.textContent = s.done ? '✓ Done' : 'Done';
        row.classList.toggle('is-done', s.done);
        markDirty();
        if (s.done && restSec) startRest(restSec, ex.name);
      }
    });
    var removeBtn = rec.sets.length > 1
      ? h('button', { class: 'remove-btn', type: 'button', 'aria-label': 'Remove set ' + (idx + 1) + ' of ' + ex.name, title: 'Remove set',
          text: '×', onclick: function () { onRemove(idx); } })
      : null;
    row.appendChild(h('div', { class: 'set-head' },
      h('span', { class: 'set-n', text: 'Set ' + (idx + 1) }),
      h('div', { class: 'set-btns' }, removeBtn, doneBtn)));
    var fields = h('div', { class: 'fields' + (timed ? ' one' : '') });
    if (timed) {
      fields.appendChild(stepper('Minutes', 'min', s.timeMin, 1, function (v) { s.timeMin = v; markDirty(); }));
    } else {
      fields.appendChild(stepper('Reps', 'reps', s.reps, 1, function (v) { s.reps = v; markDirty(); }));
      fields.appendChild(stepper('Weight (lb)', 'lb', s.weightLb, 2.5, function (v) { s.weightLb = v; markDirty(); }));
    }
    row.appendChild(fields);
    return row;
  }

  /* ---------- finish ---------- */

  function finish() {
    if (app.saving) return;
    var session = FW.buildSession({
      id: app.meta.id, day: app.day, startedAt: app.meta.startedAt, completedAt: new Date().toISOString(),
      notes: app.sessionNotes, exercises: dayObj(app.day).exercises, log: app.log
    });
    if (!session.entries.length) {
      toast('Nothing to save yet. Mark a set done or add a note.', true);
      return;
    }
    app.saving = true;
    updateFinishBar();
    run().withSuccessHandler(function () {
      app.saving = false;
      clearDraft();
      stopRest();
      var summary = FW.summarize(session);
      app.justSaved = summary;
      var recent = (app.data.recent || []).filter(function (r) { return r.id !== summary.id; });
      recent.unshift(summary);
      app.data.recent = recent;
      if (!app.data.lastByDay) app.data.lastByDay = {};
      app.data.lastByDay[String(session.day)] = session;
      startDay(FW.defaultDay(app.data.routine, app.data.recent));
      app.tab = 'history';
      app.detail = null;
      render();
      // Refresh from the server so history shows the stored versions.
      run().withSuccessHandler(function (d) {
        app.data = d;
        if (app.tab === 'history' && !app.detail) render();
      }).withFailureHandler(function () { /* keep local copy */ }).getAppData();
    }).withFailureHandler(function (e) {
      app.saving = false;
      updateFinishBar();
      toast('Save failed: ' + errMsg(e) + ' Your sets are still here. Tap Finish to retry.', true);
    }).saveSession(session);
  }

  /* ---------- history ---------- */

  function renderHistory() {
    var areas = {};
    app.data.routine.days.forEach(function (d) { areas[d.day] = d.areas; });
    if (app.justSaved) {
      var j = app.justSaved;
      root.appendChild(h('div', { class: 'banner-ok', role: 'status' },
        h('b', { text: 'Workout saved' }),
        j.setsDone + (j.setsDone === 1 ? ' set' : ' sets') + ' across ' + j.exerciseCount + (j.exerciseCount === 1 ? ' exercise' : ' exercises') + '.'));
      app.justSaved = null;
    }
    root.appendChild(h('h2', { class: 'sec', text: 'Recent workouts' }));
    var recent = app.data.recent || [];
    if (!recent.length) {
      root.appendChild(h('p', { class: 'muted', text: 'No workouts saved yet.' }));
      return;
    }
    recent.forEach(function (s) {
      root.appendChild(h('button', { class: 'hist', type: 'button', onclick: function () { openSession(s.id); } },
        h('div', { class: 'hist-main' },
          h('b', { text: FW.formatSessionDate(s.startedAt) }),
          h('span', { text: 'Day ' + s.day + ' · ' + (areas[s.day] || '') + (s.completedAt ? '' : ' · partial') })),
        h('div', { class: 'hist-sets' }, h('b', { text: String(s.setsDone) }), 'sets')));
    });
  }

  function openSession(id) {
    app.detail = { loading: true, id: id };
    render();
    run().withSuccessHandler(function (sess) {
      app.detail = { session: sess, id: id };
      render();
    }).withFailureHandler(function (e) {
      app.detail = { error: errMsg(e), id: id };
      render();
    }).getSession(id);
  }

  function renderDetail() {
    var d = app.detail;
    root.appendChild(h('button', { class: 'secondary back', type: 'button', text: '‹ History',
      onclick: function () { app.detail = null; render(); } }));
    if (d.loading) {
      root.appendChild(h('div', { class: 'center' }, h('div', { class: 'spinner' }), 'Loading…'));
      return;
    }
    if (d.error) {
      root.appendChild(h('div', { class: 'err', text: 'Could not load workout: ' + d.error }));
      root.appendChild(h('button', { class: 'secondary', type: 'button', text: 'Retry', onclick: function () { openSession(d.id); } }));
      return;
    }
    var s = d.session;
    var dayInfo = dayObj(s.day);
    root.appendChild(h('h2', { class: 'sec', text: FW.formatSessionDate(s.startedAt) + ' · Day ' + s.day + (dayInfo ? ' · ' + dayInfo.areas : '') }));
    if (!s.completedAt) root.appendChild(h('p', { class: 'muted', text: 'Partial workout (not finished).' }));
    if (s.notes) root.appendChild(h('p', { class: 'note', text: 'Notes: ' + s.notes }));
    s.entries.forEach(function (e) {
      var card = h('section', { class: 'card' }, h('div', { class: 'ex-head' }, h('h3', { text: e.name })));
      e.sets.forEach(function (st, i) {
        var txt = FW.formatLastTime({ sets: [{ reps: st.reps, weightLb: st.weightLb, timeMin: st.timeMin, done: true }] });
        card.appendChild(h('div', { class: 'detail-set' + (st.done ? '' : ' skipped') },
          h('span', { text: 'Set ' + (i + 1) }),
          h('span', { text: st.done ? txt : 'skipped' })));
      });
      if (e.notes) card.appendChild(h('p', { class: 'note', text: e.notes }));
      root.appendChild(card);
    });
  }

  boot();
})();
</script>
</body>
</html>
